name: ResortPass
description: 'ResortPass is a consumer travel and hospitality marketplace that lets
  people book hotel and resort day passes — pool access, spa treatments, cabanas,
  fitness centers, and day rooms — at over 2,000 hotels without an overnight stay,
  starting around $25. Guests search by city and date, book a pass, and enjoy resort
  amenities for the day, while partner hotels monetize otherwise-idle amenity capacity.
  Surfaced as a portfolio company of CRV and added to the API Evangelist network. No
  public developer API, API documentation, or developer portal was found during
  enrichment; the company operates a consumer web/mobile booking product and a hotel
  partner program.'
